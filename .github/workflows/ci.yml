name: CI

on:
  push:
    branches-ignore: [main] # main is tested by the Pages workflow before deploying
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: npm test
